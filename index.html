<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Work and writing by ZYAN.">
<meta name="color-scheme" content="light dark">
<title>ZYAN</title>
<script>try{if(localStorage.getItem('zyan-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(_){}</script>
<style>
:root{color-scheme:light;--paper:#e9e9eb;--ink:#171717}
:root[data-theme="dark"]{color-scheme:dark;--paper:#171717;--ink:#e9e9eb}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 "Courier New","Liberation Mono","Songti SC","Noto Serif CJK SC",SimSun,monospace;letter-spacing:0}
.page{max-width:480px;min-height:100svh;margin:0 auto;padding:40px 40px 110px}
a,button,summary{color:inherit;-webkit-tap-highlight-color:transparent}
a{text-decoration:none}
button{font:inherit;letter-spacing:inherit;border:0;border-radius:0;padding:0;background:none;cursor:pointer}
.masthead{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:20px;row-gap:12px;margin-bottom:14px}
.brand{white-space:nowrap;font-size:18px;font-weight:700;letter-spacing:-.04em}
.sections{display:flex;flex-wrap:wrap;gap:12px}
.masthead a{position:relative;display:inline-block}
.masthead a::after{position:absolute;content:"";inset:-10px -3px}
details{margin:0}
summary{padding:14px 0;list-style:none;cursor:pointer;overflow-wrap:anywhere}
summary::-webkit-details-marker{display:none}
summary::marker{content:""}
.body{padding:18px 0 14px;overflow-wrap:anywhere}
.body p{margin:0 0 24px}.body p:last-child{margin-bottom:0}
.preferences{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(100%,480px);padding:0 40px;display:flex;gap:20px;align-items:center;background:var(--paper);font-size:12px}
.preferences button{min-height:44px}
:is(a,button,summary):focus-visible{outline:1px solid currentColor;outline-offset:4px}
[hidden]{display:none!important}
@media(max-width:350px){.page{padding-inline:28px}.preferences{padding-inline:28px}.masthead{column-gap:16px}}
@media print{.preferences{display:none}.page{padding:0}}
</style>
<noscript><style>.edition[hidden]{display:block!important}</style></noscript>
</head>
<body>
<div class="page">
<header class="masthead">
<a class="brand" href="#home" lang="en" aria-label="ZYAN — Back to home">ZYAN</a>
<nav class="sections" aria-label="Sections">
<a href="#work" data-section="work" data-i18n="work">Work</a>
<a href="#writing" data-section="writing" data-i18n="writing">Writing</a>
<a href="#about" data-section="about" data-i18n="about">About</a>
</nav>
</header>
<main aria-label="ZYAN">
<section class="edition" id="work" aria-label="Work" hidden>
<details id="sound"><summary data-i18n="sound">Modular Smart Speaker</summary><div class="body"><p data-i18n="soundCopy">A design project about sound and space.</p></div></details>
<details id="lumen"><summary>LUMEN</summary><div class="body"><p data-i18n="lumenCopy">A light-alarm sleep mask.</p></div></details>
<details id="where"><summary>W「N」ERE</summary><div class="body"><p data-i18n="whereCopy">A design concept about memory.</p></div></details>
</section>
<section class="edition" id="writing" aria-label="Writing" hidden>
<details id="note"><summary data-i18n="note">Writing</summary><div class="body"><p data-i18n="noteCopy">To be updated.</p></div></details>
</section>
<section class="edition" id="about" aria-label="About" hidden>
<details id="profile"><summary>ZYAN</summary><div class="body"><p data-i18n="aboutCopy">Design and life.</p></div></details>
</section>
</main>
</div>
<nav class="preferences" aria-label="Display settings" hidden><button id="language" type="button" lang="zh-CN">中文</button><button id="theme" type="button">Dark</button></nav>
<script>
(()=>{
const root=document.documentElement;
const settings=document.querySelector('.preferences');
const languageButton=document.getElementById('language');
const themeButton=document.getElementById('theme');
const editions=[...document.querySelectorAll('.edition')];
const sectionLinks=[...document.querySelectorAll('[data-section]')];
const strings={
zh:{work:'作品',writing:'文字',about:'关于',sound:'模块化智能音响',note:'一些文字',soundCopy:'一个关于声音与空间的设计项目。',lumenCopy:'光闹钟眼罩。',whereCopy:'一个关于记忆的设计概念。',noteCopy:'待更新。',aboutCopy:'设计与生活。',dark:'深色',light:'浅色',settings:'显示设置',sections:'栏目',home:'返回首页',themeDark:'切换到深色模式',themeLight:'切换到浅色模式',description:'ZYAN 的作品与文字。'},
en:{work:'Work',writing:'Writing',about:'About',sound:'Modular Smart Speaker',note:'Writing',soundCopy:'A design project about sound and space.',lumenCopy:'A light-alarm sleep mask.',whereCopy:'A design concept about memory.',noteCopy:'To be updated.',aboutCopy:'Design and life.',dark:'Dark',light:'Light',settings:'Display settings',sections:'Sections',home:'Back to home',themeDark:'Switch to dark mode',themeLight:'Switch to light mode',description:'Work and writing by ZYAN.'}
};
let language='en',activeSection=null;
try{if(localStorage.getItem('zyan-language-v2')==='zh')language='zh'}catch(_){}
function remember(key,value){try{localStorage.setItem(key,value)}catch(_){}}
function updateTitle(){document.title=activeSection?strings[language][activeSection.id]+' — ZYAN':'ZYAN'}
function updateThemeButton(){
const dark=root.dataset.theme==='dark';
themeButton.textContent=strings[language][dark?'light':'dark'];
themeButton.setAttribute('aria-label',strings[language][dark?'themeLight':'themeDark']);
}
function translate(){
root.lang=language==='zh'?'zh-CN':'en';
document.querySelectorAll('[data-i18n]').forEach(element=>{element.textContent=strings[language][element.dataset.i18n]});
languageButton.textContent=language==='zh'?'EN':'中文';
languageButton.lang=language==='zh'?'en':'zh-CN';
languageButton.setAttribute('aria-label',language==='zh'?'Switch to English':'切换到中文');
settings.setAttribute('aria-label',strings[language].settings);
document.querySelector('.sections').setAttribute('aria-label',strings[language].sections);
document.querySelector('.brand').setAttribute('aria-label','ZYAN — '+strings[language].home);
document.querySelector('meta[name="description"]').content=strings[language].description;
editions.forEach(edition=>{edition.setAttribute('aria-label',strings[language][edition.id])});
updateThemeButton();updateTitle();
}
function route(focus=false){
const target=document.getElementById(location.hash.slice(1));
activeSection=target&&(target.matches('.edition')?target:target.closest('.edition'));
editions.forEach(edition=>{edition.hidden=edition!==activeSection});
sectionLinks.forEach(link=>{
const active=activeSection&&link.dataset.section===activeSection.id;
link.hidden=Boolean(activeSection&&!active);
if(active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');
});
if(target&&target.matches('details'))target.open=true;
updateTitle();
if(focus){
const destination=target&&target.matches('details')?target.querySelector('summary'):activeSection?sectionLinks.find(link=>link.dataset.section===activeSection.id):document.querySelector('.brand');
destination.focus({preventScroll:true});window.scrollTo(0,0);
}
}
languageButton.addEventListener('click',()=>{language=language==='zh'?'en':'zh';remember('zyan-language-v2',language);translate()});
themeButton.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';remember('zyan-theme',root.dataset.theme);updateThemeButton()});
window.addEventListener('hashchange',()=>route(true));
route();translate();settings.hidden=false;
})();
</script>
</body>
</html>
