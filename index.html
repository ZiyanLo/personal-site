<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zyan 的作品与文字。">
  <meta name="color-scheme" content="light dark">
  <title>Zyan</title>
  <script>
    try {
      if (localStorage.getItem('zyan-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (_) {}
  </script>
  <style>
    :root { color-scheme: light; --paper: #fff; --ink: #000; --link: #00e; }
    :root[data-theme="dark"] { color-scheme: dark; --paper: #000; --ink: #fff; --link: #a9bfff; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.65 "Times New Roman", "Songti SC", SimSun, serif;
      text-align: center;
    }
    .page { width: min(100% - 40px, 400px); margin: 64px auto 40px; }
    h1, p { margin: 0 0 24px; font-size: 1em; font-weight: normal; }
    a, button { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
    a { overflow-wrap: anywhere; }
    a:visited { color: var(--link); }
    a:focus-visible, button:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }
    h1:focus { outline: none; }
    ul { list-style: none; padding: 0; margin: 0; }
    .index a { display: inline-block; padding: 8px 4px; }
    .index li:last-child { margin-top: 20px; }
    .detail { display: none; }
    .detail:target { display: block; }
    main:has(.detail:target) #home { display: none; }
    .detail .copy { text-align: left; }
    .preferences { margin-top: 40px; }
    button {
      border: 0; background: none; padding: 10px 8px; min-height: 44px;
      font: inherit; cursor: pointer; border-radius: 0;
    }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { .page { margin-top: 36px; } }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <section id="home" aria-labelledby="site-name">
        <h1 id="site-name" tabindex="-1">ZYAN</h1>
        <ul class="index">
          <li><a href="#sound" data-i18n="sound">模块化智能音响</a></li>
          <li><a href="#lumen">LUMEN</a></li>
          <li><a href="#where">W「N」ERE</a></li>
          <li><a href="#note" data-i18n="note">一些文字</a></li>
          <li><a href="#about" data-i18n="about">关于</a></li>
        </ul>
      </section>
      <section class="detail" id="sound" aria-labelledby="sound-title">
        <p><a href="#home" data-i18n="back">← 返回</a></p>
        <h1 id="sound-title" tabindex="-1" data-i18n="sound">模块化智能音响</h1>
        <p class="copy" data-i18n="soundCopy">一个关于声音与空间的设计项目。</p>
      </section>
      <section class="detail" id="lumen" aria-labelledby="lumen-title">
        <p><a href="#home" data-i18n="back">← 返回</a></p>
        <h1 id="lumen-title" tabindex="-1">LUMEN</h1>
        <p class="copy" data-i18n="lumenCopy">光闹钟眼罩。</p>
      </section>
      <section class="detail" id="where" aria-labelledby="where-title">
        <p><a href="#home" data-i18n="back">← 返回</a></p>
        <h1 id="where-title" tabindex="-1">W「N」ERE</h1>
        <p class="copy" data-i18n="whereCopy">一个关于记忆的设计概念。</p>
      </section>
      <section class="detail" id="note" aria-labelledby="note-title">
        <p><a href="#home" data-i18n="back">← 返回</a></p>
        <h1 id="note-title" tabindex="-1" data-i18n="note">一些文字</h1>
        <p class="copy" data-i18n="noteCopy">待更新。</p>
      </section>
      <section class="detail" id="about" aria-labelledby="about-title">
        <p><a href="#home" data-i18n="back">← 返回</a></p>
        <h1 id="about-title" tabindex="-1" data-i18n="about">关于</h1>
        <p class="copy" data-i18n="aboutCopy">设计与生活。</p>
      </section>
    </main>
    <nav class="preferences" aria-label="显示设置" hidden>
      <button id="language" type="button" lang="en">English</button>
      <button id="theme" type="button">深色</button>
    </nav>
  </div>
  <script>
    (() => {
      const root = document.documentElement;
      const settings = document.querySelector('.preferences');
      const languageButton = document.getElementById('language');
      const themeButton = document.getElementById('theme');
      const translations = {
        zh: {
          sound: '模块化智能音响', note: '一些文字', about: '关于', back: '← 返回',
          soundCopy: '一个关于声音与空间的设计项目。', lumenCopy: '光闹钟眼罩。',
          whereCopy: '一个关于记忆的设计概念。', noteCopy: '待更新。', aboutCopy: '设计与生活。',
          dark: '深色', light: '浅色', settings: '显示设置',
          themeDark: '切换到深色模式', themeLight: '切换到浅色模式',
          description: 'Zyan 的作品与文字。'
        },
        en: {
          sound: 'Modular smart speaker', note: 'Writing', about: 'About', back: '← Back',
          soundCopy: 'A design project about sound and space.', lumenCopy: 'A light-alarm sleep mask.',
          whereCopy: 'A design concept about memory.', noteCopy: 'To be updated.', aboutCopy: 'Design and life.',
          dark: 'Dark', light: 'Light', settings: 'Display settings',
          themeDark: 'Switch to dark mode', themeLight: 'Switch to light mode',
          description: 'Work and writing by Zyan.'
        }
      };
      let language = 'zh';
      try { if (localStorage.getItem('zyan-language') === 'en') language = 'en'; } catch (_) {}
      function remember(key, value) {
        try { localStorage.setItem(key, value); } catch (_) {}
      }
      function currentSection() {
        return [...document.querySelectorAll('main > section')].find(section => '#' + section.id === location.hash)
          || document.getElementById('home');
      }
      function updateTitle() {
        const section = currentSection();
        document.title = section.id === 'home' ? 'Zyan' : section.querySelector('h1').textContent + ' — Zyan';
      }
      function updateThemeButton() {
        const dark = root.dataset.theme === 'dark';
        themeButton.textContent = translations[language][dark ? 'light' : 'dark'];
        themeButton.setAttribute('aria-label', translations[language][dark ? 'themeLight' : 'themeDark']);
      }
      function translate() {
        root.lang = language === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-i18n]').forEach(element => {
          element.textContent = translations[language][element.dataset.i18n];
        });
        languageButton.textContent = language === 'zh' ? 'English' : '中文';
        languageButton.lang = language === 'zh' ? 'en' : 'zh-CN';
        languageButton.setAttribute('aria-label', language === 'zh' ? 'Switch to English' : '切换到中文');
        settings.setAttribute('aria-label', translations[language].settings);
        document.querySelector('meta[name="description"]').content = translations[language].description;
        updateThemeButton();
        updateTitle();
      }
      languageButton.addEventListener('click', () => {
        language = language === 'zh' ? 'en' : 'zh';
        remember('zyan-language', language);
        translate();
      });
      themeButton.addEventListener('click', () => {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        remember('zyan-theme', root.dataset.theme);
        updateThemeButton();
      });
      window.addEventListener('hashchange', () => {
        updateTitle();
        currentSection().querySelector('h1').focus({ preventScroll: true });
        window.scrollTo(0, 0);
      });
      translate();
      settings.hidden = false;
    })();
  </script>
</body>
</html>
